# --------------------------------------------------------------------------
# Conjunto minimo - o que torna um produtor apto a entrar num lote.
# Alimenta a regra R6 da checagem 05 e o mapa de lacunas da ingestao.
# Pendencia T-03: fechar com a cooperativa.
# --------------------------------------------------------------------------
