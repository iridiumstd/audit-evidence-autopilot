# params/cacau.yml
# Parametros da commodity. Trocar de commodity = trocar este arquivo,
# sem tocar em codigo nenhum.
#
# Fonte: TAXONOMIA.md secoes 2, 3 e 4. Os nomes canonicos sao fixos - sao o
# contrato entre a Trilha A (que grava documento.tipo) e a Trilha B (que
# procura por tipo). Palavras-chave e validade_dias sao PROPOSTA A VALIDAR
# (pendencias T-01 e T-02 da TAXONOMIA.md), nao parecer juridico.

commodity: cacau
regiao_padrao: transamazonica
municipios_recorte: [Medicilandia, Altamira, Uruara, Brasil Novo]
uf_recorte: PA

# --------------------------------------------------------------------------
# Checagem 06 - coerencia de volume. Ver pendencia P-01 do ADR.md.
# --------------------------------------------------------------------------
produtividade_kg_ha:
  PA: 900                     # a confirmar
  BA: 270                     # a confirmar
  limiar_excecao: 1.5         # acima de 150% do esperado -> excecao
  limiar_bloqueio: 3.0        # acima de 300% do esperado -> bloqueio

# --------------------------------------------------------------------------
# Regra R39 - soma das notas do produtor contra area x produtividade maxima
# regional. DESLIGADA de proposito.
#
# Regra de ouro no 8 do contrato.md: nenhum numero inventado vira parametro.
# A taxonomia registra que a produtividade MAXIMA regional nao foi levantada
# em fonte citavel, entao o parametro fica VAZIO (null) e a regra fica com
# ativa: false. Inventar um teto que a banca possa contestar custa mais caro
# que deixar a regra desligada.
#
# Para ligar: levantar a fonte (CEPLAC/IBGE PAM por municipio do recorte),
# preencher produtividade_maxima_kg_ha e so entao virar ativa: true.
#
# ATENCAO: isto NAO substitui produtividade_kg_ha acima, que e a produtividade
# ESPERADA usada pela checagem 06 e continua valendo como esta.
# --------------------------------------------------------------------------
r39_produtividade_maxima:
  ativa: false                          # regra desligada enquanto o parametro estiver vazio
  produtividade_maxima_kg_ha:
    PA: null                            # nao levantado - ver regra de ouro no 8
    BA: null                            # nao levantado - ver regra de ouro no 8
  fonte: null                           # preencher junto com o numero
  observacao: "Parametro nao levantado. R39 permanece desligada (correcoes-spec_1.md secao 04)."

# --------------------------------------------------------------------------
# Checagem 02 - embargo do Ibama
# --------------------------------------------------------------------------
embargo:
  distancia_excecao_m: 500    # limitrofe: intersecao nao, mas perto demais

# --------------------------------------------------------------------------
# Checagem 01 - desmate pos-2020 (perna A)
# --------------------------------------------------------------------------
desmatamento:
  data_corte: "2020-12-31"

# --------------------------------------------------------------------------
# Confianca da ingestao
# --------------------------------------------------------------------------
confianca:
  limiar_ilegivel: 0.4

# --------------------------------------------------------------------------
